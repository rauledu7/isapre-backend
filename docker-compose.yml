version: '3.8'

services:
  # 1. Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: isapre-db
    restart: always
    environment:
      # Estos valores se leen de tu archivo .env local
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-isapre_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend NestJS
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: isapre-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      # IMPORTANTE: No pasamos DATABASE_URL para forzar el modo local (SSL OFF)
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-admin123}
      - DB_NAME=${DB_NAME:-isapre_db}
      - PORT=3000
      # Configuración de Telegram para que el bot funcione en local
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - CHAT_ID=${CHAT_ID}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db

  # 3. Herramienta visual (Adminer)
  adminer:
    image: adminer
    container_name: isapre-adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data: